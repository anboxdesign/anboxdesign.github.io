<script data-anbox-mobile-runtime="06">
(function(){
  var root=document.querySelector('.anbox-mobile-part--06');
  var query=window.matchMedia('(max-width:640px)');
  var started=false;
  function start(){
    if(started||!query.matches||!root)return;
    started=true;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const logoMarqueeSection = root.querySelector('[data-logo-marquee]');
      const logoMarquee = logoMarqueeSection.querySelector('.logo-marquee');
      const logoRows = [...logoMarquee.querySelectorAll('.logo-row')];
      let logoMarqueeFrame = 0;
      let logoMarqueeVisible = true;

      const syncLogoMarquee = () => {
        logoMarqueeFrame = 0;
        const sectionRect = logoMarqueeSection.getBoundingClientRect();
        const progress = Math.min(1, Math.max(0, (innerHeight - sectionRect.top) / (innerHeight + sectionRect.height)));

        logoRows.forEach((row, index) => {
          const track = row.querySelector('.logo-track');
          const travel = Math.max(0, track.scrollWidth - row.clientWidth);
          const phase = reducedMotion.matches
            ? (index === 0 ? .65 : .15)
            : (index === 0 ? .96 - .76 * progress : .04 + .76 * progress);
          track.style.setProperty('--logo-x', `${(-travel * phase).toFixed(2)}px`);
        });
      };

      const scheduleLogoMarquee = () => {
        if (!logoMarqueeVisible || reducedMotion.matches || logoMarqueeFrame) return;
        logoMarqueeFrame = requestAnimationFrame(syncLogoMarquee);
      };

      if ('IntersectionObserver' in window) {
        const logoObserver = new IntersectionObserver(([entry]) => {
          logoMarqueeVisible = entry.isIntersecting;
          logoMarquee.classList.toggle('is-scroll-active', logoMarqueeVisible && !reducedMotion.matches);
          if (logoMarqueeVisible) requestAnimationFrame(syncLogoMarquee);
        }, { rootMargin: '20% 0px' });
        logoObserver.observe(logoMarqueeSection);
      }

      window.addEventListener('scroll', scheduleLogoMarquee, { passive: true });
      window.addEventListener('resize', () => requestAnimationFrame(syncLogoMarquee), { passive: true });
      reducedMotion.addEventListener?.('change', () => {
        logoMarquee.classList.toggle('is-scroll-active', logoMarqueeVisible && !reducedMotion.matches);
        requestAnimationFrame(syncLogoMarquee);
      });
      requestAnimationFrame(syncLogoMarquee);
  }
  start();
  if(query.addEventListener)query.addEventListener('change',start);
  else if(query.addListener)query.addListener(start);
})();
</script>
