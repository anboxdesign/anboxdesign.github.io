<script>
(function () {
  "use strict";

  function anxlInit() {
    var root = document.getElementById("anxl-logos");
    var track;
    var sourceGroup;
    var viewport;
    var resizeFrame = 0;

    if (!root || root.dataset.anxlReady === "true") {
      return;
    }

    root.dataset.anxlReady = "true";
    track = root.querySelector(".anxl__track");
    sourceGroup = track && track.querySelector(".anxl__group");
    viewport = root.querySelector(".anxl__viewport");

    if (!track || !sourceGroup || !viewport) {
      return;
    }

    function addClone() {
      var clone = sourceGroup.cloneNode(true);
      clone.setAttribute("aria-hidden", "true");
      Array.prototype.forEach.call(clone.querySelectorAll("img"), function (image) {
        image.alt = "";
      });
      track.appendChild(clone);
    }

    function syncTrack() {
      var sourceWidth;
      var copies;
      var index;

      root.classList.remove("anxl-is-ready");
      Array.prototype.forEach.call(
        track.querySelectorAll('.anxl__group[aria-hidden="true"]'),
        function (group) { group.remove(); }
      );

      sourceWidth = sourceGroup.getBoundingClientRect().width;
      if (!sourceWidth) {
        return;
      }

      track.style.setProperty("--anxl-shift", -Math.round(sourceWidth) + "px");
      copies = Math.max(2, Math.ceil((viewport.clientWidth + sourceWidth) / sourceWidth));
      for (index = 1; index < copies; index += 1) {
        addClone();
      }

      void track.offsetWidth;
      root.classList.add("anxl-is-ready");
    }

    function requestSync() {
      if (resizeFrame) {
        window.cancelAnimationFrame(resizeFrame);
      }
      resizeFrame = window.requestAnimationFrame(function () {
        resizeFrame = 0;
        syncTrack();
      });
    }

    syncTrack();

    if ("ResizeObserver" in window) {
      root.anxlResizeObserver = new ResizeObserver(requestSync);
      root.anxlResizeObserver.observe(viewport);
    } else {
      window.addEventListener("resize", requestSync, { passive: true });
      root.anxlResizeHandler = requestSync;
    }

    if (!("IntersectionObserver" in window)) {
      return;
    }

    root.anxlObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        root.classList.toggle("anxl-is-paused", !entry.isIntersecting);
      });
    }, { threshold: 0 });

    root.anxlObserver.observe(root);
  }

  if (typeof window.t_onReady === "function") {
    window.t_onReady(anxlInit);
  } else if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", anxlInit, { once: true });
  } else {
    anxlInit();
  }
})();
</script>
