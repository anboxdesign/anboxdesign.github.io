<style data-anbox-hero-current>
@font-face{font-family:"ANBOX Display";src:url("https://static.tildacdn.com/tild6161-6662-4533-b365-636333303466/bebas-neue-bold.woff") format("woff");font-weight:700;font-display:swap}
.abh-hero,.abh-hero *{box-sizing:border-box}.abh-hero{--ink:#151716;--paper:#f3f4f0;--white:#fff;--purple:#ad95ee;--lime:#dde63f;position:relative;width:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Onest",Arial,sans-serif}.abh-hero a{color:inherit;text-decoration:none}.abh-hero__stage{position:relative;width:calc(100% - (clamp(20px,6.667vw,256px) * 2));max-width:3328px;min-height:760px;margin:auto;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;padding:102px 0 20px}.abh-hero__copy{grid-column:1/7;align-self:center;z-index:2;padding-bottom:84px}.abh-hero__title{max-width:650px;margin:0;font-family:"ANBOX Display","Arial Narrow",Arial,sans-serif;font-size:clamp(76px,6.25vw,96px);font-weight:700;line-height:.92;letter-spacing:-.02em;text-transform:uppercase}.abh-hero__title span{display:block}.abh-hero__subtitle{margin:24px 0 0;max-width:520px;color:#74716d;font-size:20px;line-height:1.2}.abh-hero__actions{margin-top:32px;display:flex;align-items:center;gap:42px}.abh-hero__primary{width:300px;min-height:54px;padding:0 18px 0 22px;display:flex;align-items:center;justify-content:space-between;border-radius:8px;background:var(--lime);font-size:12px;font-weight:700;text-transform:uppercase;transition:filter .2s ease,transform .25s cubic-bezier(.22,1,.36,1)}.abh-hero__primary>span:last-child{display:block;transition:transform .25s cubic-bezier(.22,1,.36,1)}@media(hover:hover) and (pointer:fine){.abh-hero__primary:hover{filter:brightness(.96);transform:translateY(-2px)}.abh-hero__primary:hover>span:last-child{transform:translateX(4px)}}.abh-hero__primary:focus-visible>span:last-child{transform:translateX(4px)}.abh-hero__secondary{padding:10px 0;border-bottom:1px solid var(--purple);color:var(--purple);font-size:13px}.abh-hero__visual{position:relative;grid-column:7/13;min-height:638px;overflow:hidden;border-radius:8px;background:#ddd}.abh-hero__slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s cubic-bezier(.22,1,.36,1)}.abh-hero__slide.is-active{opacity:1;visibility:visible}.abh-hero__slide img{width:100%;height:100%;display:block;object-fit:cover}.abh-hero__project{position:absolute;z-index:3;right:20px;bottom:20px;width:236px;min-height:155px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;border-radius:8px;background:rgba(255,255,255,.9);color:var(--ink)}.abh-hero__project strong{font-size:15px;text-transform:uppercase}.abh-hero__project small{display:block;margin-top:5px;color:#77736f;font-size:11px;text-transform:uppercase}.abh-hero__project-bottom{display:flex;align-items:end;justify-content:space-between}.abh-hero__counter{font-size:25px;font-weight:600}.abh-hero__project-link{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--lime);font-size:18px}.abh-hero__dots{position:absolute;z-index:4;bottom:8px;left:50%;display:flex;gap:5px;transform:translateX(-50%)}.abh-hero__dot{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.48);cursor:pointer}.abh-hero__dot.is-active{background:#fff}.abh-hero__shelf{position:absolute;z-index:5;right:30%;bottom:40px;left:0;height:86px;display:grid;grid-template-columns:170px 1fr;overflow:hidden;border:1px solid rgba(21,23,22,.13);border-radius:8px;background:rgba(255,255,255,.94)}.abh-hero__shelf-label{padding:0 22px;display:flex;align-items:center;border-right:0;font-size:11px;font-weight:700;line-height:1.3;text-transform:uppercase}.abh-hero__shelf-view{min-width:0;overflow:hidden}.abh-hero__shelf-track{width:200%;height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));animation:abh-shelf 26s linear infinite;will-change:transform}.abh-hero__shelf-group{height:100%;padding:0 14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:12px}.abh-hero__brand{min-width:0;height:100%;padding:0 8px;display:grid;place-items:center;border-right:0}.abh-hero__brand img{width:100%;max-width:120px;height:36px;display:block;object-fit:contain}@keyframes abh-shelf{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}.abh-hero :focus-visible{outline:2px solid var(--purple);outline-offset:3px}
@media(min-width:1600px){.abh-hero__stage{min-height:800px}}
@media(max-width:900px) and (min-width:641px){.abh-hero__stage{min-height:680px;padding-top:94px}.abh-hero__title{font-size:66px}.abh-hero__subtitle{font-size:17px}.abh-hero__visual{min-height:560px}.abh-hero__primary{width:240px}.abh-hero__shelf{right:28%}}
@media(prefers-reduced-motion:reduce){.abh-hero__slide{transition:none}.abh-hero__primary,.abh-hero__primary>span:last-child{transition:none!important;transform:none!important}}
</style>

<script data-anbox-hero-current>
(function(){var root=document.querySelector('.abh-hero');if(!root||root.dataset.ready)return;root.dataset.ready='1';var slides=[].slice.call(root.querySelectorAll('.abh-hero__slide')),dots=[].slice.call(root.querySelectorAll('[data-dot]')),title=root.querySelector('[data-project-title]'),meta=root.querySelector('[data-project-meta]'),count=root.querySelector('[data-project-current]'),link=root.querySelector('[data-project-link]'),i=0,timer;function show(n){i=(n+slides.length)%slides.length;slides.forEach(function(s,x){s.classList.toggle('is-active',x===i)});dots.forEach(function(d,x){d.classList.toggle('is-active',x===i);d.setAttribute('aria-selected',String(x===i))});var s=slides[i];title.textContent=s.dataset.title;meta.textContent=s.dataset.meta;count.textContent=String(i+1).padStart(2,'0');link.href=s.dataset.link}function start(){clearInterval(timer);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(function(){show(i+1)},5000)}dots.forEach(function(d){d.addEventListener('click',function(){show(+d.dataset.dot);start()})});show(0);start();document.addEventListener('visibilitychange',function(){document.hidden?clearInterval(timer):start()})})();
</script>
