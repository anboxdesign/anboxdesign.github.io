<style data-anbox-footer="light-v2">
.anbox-part-10{
  --anbox-footer-ink:#151716;
  --anbox-footer-muted:rgba(21,23,22,.62);
  --anbox-footer-bg:#f3f4f0;
  --anbox-footer-purple:#ad95ee;
  --anbox-content-inset:6.6667vw;
  box-sizing:border-box;
  width:100%;
  margin:0;
  overflow:hidden;
  background:var(--anbox-footer-bg);
  color:var(--anbox-footer-ink);
  font-family:var(--anbox-font-text,"Onest",Arial,sans-serif);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.anbox-part-10,.anbox-part-10 *{box-sizing:border-box}
.anbox-part-10 a{color:inherit;text-decoration:none}
.anbox-part-10 a:focus-visible{outline:2px solid var(--anbox-footer-purple);outline-offset:4px}
.anbox-part-10 .abct__site-footer{
  width:100%;
  margin:0 auto;
  padding:40px var(--anbox-content-inset);
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  grid-template-rows:auto auto;
  column-gap:20px;
  row-gap:12px;
  align-items:center;
}
.anbox-part-10 .abct__footer-logo{grid-column:1 / 4;grid-row:1;width:150px;line-height:0}
.anbox-part-10 .abct__footer-logo svg{display:block;width:100%;height:auto}
.anbox-part-10 .abct__footer-line{
  grid-column:1 / 5;
  grid-row:2;
  margin:0;
  color:var(--anbox-footer-muted);
  font-size:12px;
  line-height:1.4;
}
.anbox-part-10 .abct__footer-legal{
  grid-column:5 / 13;
  grid-row:2;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:24px;
  color:var(--anbox-footer-muted);
  font-size:10px;
  font-weight:500;
  line-height:1.35;
  text-align:right;
}
.anbox-part-10 .abct__footer-legal>*{white-space:nowrap}
.anbox-part-10 .abct__footer-legal a{transition:color .22s ease}
.anbox-part-10 .abct__footer-end{grid-column:9 / 13;grid-row:1;display:flex;justify-content:flex-end;align-items:center}
.anbox-part-10 .abct__footer-socials{display:flex;align-items:center;gap:18px}
.anbox-part-10 .abct__footer-socials a{
  width:24px;
  height:24px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--anbox-footer-ink);
  transition:color .22s ease,transform .22s cubic-bezier(.22,1,.36,1);
}
.anbox-part-10 .abct__footer-socials svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.anbox-part-10 .abct__social-behance span{font-size:16px;font-weight:600;line-height:1}
@media (hover:hover) and (pointer:fine){
  .anbox-part-10 .abct__footer-legal a:hover{color:var(--anbox-footer-ink)}
  .anbox-part-10 .abct__footer-socials a:hover{color:var(--anbox-footer-purple);transform:translateY(-2px)}
}
@media (max-width:960px){
  .anbox-part-10 .abct__site-footer{
    width:100%;
    padding:32px clamp(16px,4.6vw,24px);
    grid-template-columns:repeat(8,minmax(0,1fr));
    row-gap:18px;
  }
  .anbox-part-10 .abct__footer-logo{grid-column:1 / 4}
  .anbox-part-10 .abct__footer-end{grid-column:6 / 9}
  .anbox-part-10 .abct__footer-line{grid-column:1 / 5}
  .anbox-part-10 .abct__footer-legal{grid-column:5 / 9;gap:14px;flex-wrap:wrap}
}
@media (max-width:640px){
  .anbox-part-10 .abct__site-footer{
    padding:28px 16px 24px;
    grid-template-columns:minmax(0,1fr) auto;
    row-gap:22px;
  }
  .anbox-part-10 .abct__footer-logo{grid-column:1;grid-row:1;width:148px}
  .anbox-part-10 .abct__footer-end{grid-column:2;grid-row:1}
  .anbox-part-10 .abct__footer-line{grid-column:1 / 3;grid-row:2;max-width:260px}
  .anbox-part-10 .abct__footer-legal{
    grid-column:1 / 3;
    grid-row:3;
    padding-top:18px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:flex-start;
    gap:10px;
    border-top:1px solid rgba(21,23,22,.14);
    font-size:11px;
    text-align:left;
  }
  .anbox-part-10 .abct__footer-legal>*{white-space:normal}
}
@media (min-width:1921px){
  .anbox-part-10 .abct__site-footer{
    width:calc(100vw - clamp(24px,6.667vw,256px) * 2);
    max-width:none;
    padding:clamp(40px,2.083vw,80px) 0;
    column-gap:clamp(20px,1.042vw,40px);
    row-gap:clamp(12px,.625vw,24px);
  }
  .anbox-part-10 .abct__footer-logo{width:clamp(150px,7.813vw,300px)}
  .anbox-part-10 .abct__footer-line{font-size:clamp(12px,.625vw,24px)}
  .anbox-part-10 .abct__footer-legal{gap:clamp(24px,1.25vw,48px);font-size:clamp(10px,.521vw,20px)}
  .anbox-part-10 .abct__footer-socials{gap:clamp(18px,.938vw,36px)}
  .anbox-part-10 .abct__footer-socials a{width:clamp(24px,1.25vw,48px);height:clamp(24px,1.25vw,48px)}
  .anbox-part-10 .abct__footer-socials svg{width:clamp(18px,.938vw,36px);height:clamp(18px,.938vw,36px)}
  .anbox-part-10 .abct__social-behance span{font-size:clamp(16px,.833vw,32px)}
}
@media (prefers-reduced-motion:reduce){
  .anbox-part-10 .abct__footer-legal a,.anbox-part-10 .abct__footer-socials a{transition:none}
}
</style>
